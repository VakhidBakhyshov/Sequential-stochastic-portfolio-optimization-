# Advanced research configuration: Bayesian-CVaR optimizer + nested train/test selection + smart signals.
balance: 1000.0
window: rolling
lookback_years: 3
initial_weight: equal
portfolio: filtered
use_backtest_engine: false
output_folder: advanced_smart_bayesian
is_previous: true
seed: 42

model:
  - type: bayessian
  - matrix_type: fast
  - mean_return: sampled
  - distribution: normal
  - posterior: horseshoe
  - n_samples: 1000
  - horizon: 21
  - cov_method: ledoit_wolf
  - random_state: 42
  # Scenario-fan additions from FINAL-copy: posterior mean + Cholesky covariance fan.
  - shrink_floor: 0.5
  - mom_tilt: 0.3
  - mom_lookback: 252
  - mom_gap: 21

optimizer:
  - type: bayessian
    min_weight: 0.005
    max_weight: 0.12
    task_type: "cvar_returns"
    confidence_level: 0.95
    forecast_cvar_level: 0.95
    turnover_penalty: 0.01
    penalty_type: L1
    is_all_methods: false

execution:
  - type: base_exec
    return_type: "log-returns"
    is_past: true
    use_dynamic_alpha: true
    c_bps: 0.001

backtest_engine:
  validation_months: 6
  internal_test_months: 2
  top_k_validation: 5
  select_metric: score
  alpha_grid: [1.0, 0.75, 0.50, 0.25]
  rank_penalty_turnover: 0.02
  include_hold_current: true
  include_strategies: true
  refit_on_full_history: true

smart_signals:
  enabled: true
  apply_position_sizing: true
  allow_cash_overlay: true
  # Forward controls
  kelly_cap: 0.25
  portfolio_kelly_cap: 1.0
  target_portfolio_kelly: 0.50
  risk_reward_cap: 5.0
  target_risk_reward: 1.5
  # Backward regime controls
  target_monthly_vol: 0.035
  min_overlay: 0.30
  target_signal_quality: 0.55
  er_window: 21
  atr_short_window: 21
  atr_long_window: 126
  breakout_window: 63
  pullback_window: 63
  spike_window: 21
  net_move_window: 21
  liquidity_window: 21
  # GARCH(1,1)-style vol clustering parameters
  garch_omega: 0.000001
  garch_alpha: 0.08
  garch_beta: 0.90
