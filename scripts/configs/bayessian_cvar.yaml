balance: 1000.0
window: rolling
lookback_years: 3
initial_weight: equal
portfolio: filtered
# portfolio: sp500_benchmark
use_backtest_engine: false
output_folder: advanced_bayesian_walk_forward_no_max
is_previous: true # IMPROVING ALL STRATEGIES (if == is_previous: true - strong changing in rebalancing and decreasing pnl)
seed: 42


# model: # LOW-AVERAGE case (LOW - where is_previous: false, AVERAGE - where is_previous: true)
