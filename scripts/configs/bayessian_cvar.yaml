model: # BEST CASE
  - type: bayessian
  - matrix_type: fast
  - mean_return: sampled
  - distribution: normal
  - posterior: horseshoe
  # - is_sampled_mean: true
  - n_samples: 1000
  - horizon: 21
  - cov_method: ledoit_wolf
  - random_state: 42


optimizer:
  - type: bayessian
    min_weight: 0.005
    max_weight: 0.12
    task_type: "cvar_returns"
    confidence_level: 0.99
    turnover_penalty: 1.0
    penalty_type: L1
    is_all_methods: false
    # constraint_max_weight: false


# optimizer:
#   - type: black_litterman
#     # is_all_methods: true


# optimizer:
#   - type: markowitz
