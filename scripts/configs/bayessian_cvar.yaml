#     turnover_penalty: 0.5
#     penalty_type: L2
#     is_all_methods: false


execution:
  - type: base_exec
    return_type: "log-returns"
    is_past: True  # for run.py
    # is_past: False # for new_run2.py
    # fixed_alpha: 0.50
    use_dynamic_alpha: true
    c_bps: 1e-3 # high
    # c_bps: 0.0025 # a realistic ETF average
    # c_bps: 1e-4 # low
