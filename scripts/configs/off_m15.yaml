balance: 1000.0
window: rolling
lookback_years: 3
initial_weight: equal
portfolio: filtered
use_backtest_engine: false
output_folder: off_m15
is_previous: true
seed: 42


model: # BEST CASE
  - type: bayessian
  - matrix_type: fast
  - mean_return: sampled
  - distribution: normal
  - posterior: horseshoe
  - n_samples: 1000
  - n_scenarios: 1000        # EXP2: real (S x N) posterior-predictive fan -> CVaR is a true tail
  - horizon: 21
  - cov_method: ledoit_wolf
  - random_state: 42


optimizer:
  - type: bayessian
    min_weight: 0.005
    max_weight: 0.12
    task_type: "return_cvar_constraint"   # EXP2: MAX return s.t. CVaR <= budget (was min-CVaR)
    confidence_level: 0.95                 # CVaR tail level (worst 5% of 1000 scenarios)
    cvar_budget_mult: 1.5                  # budget = 1.0 x CVaR(equal-weight): tail <= naive 1/N
    turnover_penalty: 0.01                 # low inertia so it can hold the return-max book
    penalty_type: L1
    is_all_methods: false
    dynamic_parameters:
      enabled: false


execution:
  - type: base_exec
    return_type: "log-returns"
    is_past: True
    use_dynamic_alpha: true
    c_bps: 1e-3
