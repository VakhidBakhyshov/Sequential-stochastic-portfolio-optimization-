model: # BEST
  - type: bayessian
  - matrix_type: fast
  - mean_return: sampled
  - distribution: normal
  - posterior: horseshoe
  # - is_sampled_mean: true
  - n_samples: 1000
  - horizon: 21
  - cov_method: ledoit_wolf
  - random_state: 42


# model:
#   - type: ml_regression
#   - ml_type: ridge
#   - horizon: 21             # <-- Forward prediction days (approx 1 month)
#   - cv_splits: 3            # <-- Number of time-series cross-validation splits
#   - n_samples: 1000         # <-- Keeps compatibility with your CVaR optimizer


optimizer:
  - type: bayessian
    min_weight: 0.005
    max_weight: 0.12
    task_type: "cvar_returns"
    confidence_level: 0.99
    turnover_penalty: 1.0
    penalty_type: L1
    is_all_methods: false


