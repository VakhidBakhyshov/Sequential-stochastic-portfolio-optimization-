balance: 1000.0
window: rolling
lookback_years: 3
initial_weight: equal
portfolio: filtered
# portfolio: sp500_benchmark
use_backtest_engine: true
output_folder: advanced_bayesian_walk_forward
is_previous: false
seed: 42


# model:
#   - type: bayessian
#   - mean_return: historical
#   - distribution: t_student
#   - posterior: empirical_bayes
#   - n_samples: 2000
#   - horizon: 21
#   - cov_method: oas
