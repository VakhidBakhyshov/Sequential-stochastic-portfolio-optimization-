balance: 1000.0
window: rolling
lookback_years: 3
initial_weight: equal
portfolio: filtered
use_backtest_engine: false
output_folder: main_dyn_on
is_previous: true
seed: 42


model: # BEST CASE
  - type: bayessian
  - matrix_type: fast
  - mean_return: sampled
  - distribution: normal
  - posterior: horseshoe
  - n_samples: 1000
  - horizon: 21
  - cov_method: ledoit_wolf
  - random_state: 42


optimizer:
  - type: bayessian
    min_weight: 0.005
    max_weight: 0.12
    task_type: "cvar_returns"
    confidence_level: 0.99
    turnover_penalty: 1.0
    penalty_type: L1
    is_all_methods: false
    dynamic_parameters:
      enabled: true


execution:
  - type: base_exec
    return_type: "log-returns"
    is_past: True
    use_dynamic_alpha: true
    c_bps: 1e-3
