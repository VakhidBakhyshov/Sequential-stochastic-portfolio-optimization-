balance: 1000.0
window: rolling
lookback_years: 3
initial_weight: equal
portfolio: filtered
use_backtest_engine: true
strict_nested_engine: true  # publication mode: abort rather than mix in legacy fallback
output_folder: strategy_smart_liquidity_weighted
is_previous: false
seed: 42

model:
  - type: bayessian
  - matrix_type: fast
  - distribution: t_student
  - df: 5
  - posterior: empirical_bayes
  - n_samples: 1000
  - n_scenarios: 1000
  - horizon: 21
  - scenario_return_type: log-returns
  - cov_method: ledoit_wolf
  - random_state: 42
  - mom_tilt: 0.10

strategy:
  - type: liquidity_weighted
    min_weight: 0.0
    max_weight: 0.12

strategy_param_grid:
  type: [equal_weight, inverse_volatility, risk_parity, liquidity_weighted, momentum_volatility, liquidity_momentum, minimum_correlation]
  min_weight: [0.0]
  max_weight: [0.08, 0.12]
  top_k: [25, 40]
  momentum_lookback: [63, 126]
  liquidity_power: [0.25]

execution:
  - type: base_exec
    return_type: log-returns
    is_past: true
    use_dynamic_alpha: true
    c_bps: 0.001

backtest_engine:
  validation_months: 9
  internal_test_months: 3
  top_k_validation: 8
  select_metric: score
  alpha_grid: [1.0, 0.75, 0.50, 0.25]
  include_hold_current: true
  include_optimizers: false
  include_strategies: true
  refit_on_full_history: true
  stability_weight: 0.50
  degradation_penalty: 0.25

smart_signals:
  enabled: true
  apply_position_sizing: true
  allow_cash_overlay: true
  horizon: 21
  cvar_alpha: 0.95
  overlay_combination: geometric_mean
  kelly_cap: 0.25
  risk_reward_cap: 5.0
  target_monthly_vol: 0.035
  min_overlay: 0.30
  target_signal_quality: 0.55
  max_active_weight: 0.12

research_validation:
  enabled: true
  periods_per_year: 12
  risk_free_rate: 0.02
  adjust_serial_correlation: true
  psr_threshold: 0.95
  dsr_threshold: 0.95
  fdr_alpha: 0.05
  dsr_trial_count_mode: raw  # conservative publication denominator: every counted recipe
  num_trials_override: null
  trial_sharpe_mean_override: null
  trial_sharpe_std_override: null

# Multi-signal publication research: dependence, conditional cointegration,
# distribution GOF, causal incremental information, subset ablations and heatmaps.
signal_research:
  enabled: true
  rolling_window: 24
  max_lag: 6
  defensive_quantile: 0.20
  min_train: 24
  distribution_bootstrap_samples: 199
  conditional_bins: 5
  max_surface_signals: 6
