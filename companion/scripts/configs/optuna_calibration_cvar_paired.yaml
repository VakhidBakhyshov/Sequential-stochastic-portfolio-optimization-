# Matched CVaR calibration arm for the CDaR study. Search ranges mirror the CDaR
# calibration except for the risk-specific confidence/budget parameters.
study_name: bayessian_cvar_paired_risk_control
base_config: scripts/configs/bayessian_cvar_paired.yaml
entrypoint: scripts.runs.run
output_folder: results/calibration/bayessian_cvar_paired_risk_control
trial_results_root: results/calibration_runs
n_trials: 60
evaluation_sample: test
tail_risk_objective: cvar
sync_nested_optimizer_grid: true
show_progress_bar: true
seed: 42
sampler:
  seed: 42
  population_size: 20
search_space:
  optimizer.0.max_weight: {type: float, low: 0.08, high: 0.16, step: 0.01}
  optimizer.0.turnover_penalty: {type: float, low: 0.0005, high: 0.008, log: true}
  optimizer.0.confidence_level: {type: categorical, choices: [0.90, 0.95, 0.975, 0.99]}
  optimizer.0.cvar_budget_mult: {type: float, low: 0.80, high: 1.20, step: 0.05}
  model.0.prior_strength: {type: float, low: 21.0, high: 126.0, step: 21.0}
  model.0.mom_tilt: {type: float, low: 0.0, high: 0.25, step: 0.025}
  model.0.shrink_floor: {type: float, low: 0.10, high: 0.60, step: 0.05}
  backtest_engine.stability_weight: {type: float, low: 0.0, high: 1.0, step: 0.10}
  backtest_engine.degradation_penalty: {type: float, low: 0.0, high: 0.75, step: 0.05}
  smart_signals.target_monthly_vol: {type: float, low: 0.02, high: 0.06, step: 0.005}
  smart_signals.cvar_target_multiplier: {type: float, low: 0.70, high: 1.30, step: 0.05}
  smart_signals.min_overlay: {type: float, low: 0.10, high: 0.60, step: 0.05}
  smart_signals.forward_weight: {type: float, low: 0.20, high: 0.80, step: 0.10}
selection:
  return_floor_quantile: 0.35
  minimum_annual_return: 0.05
  minimum_dsr: 0.50
  top_fraction: 0.20
  parameter_bins: 6
  return_weights:
    annualized_return: 1.00
    sharpe_ratio: 0.15
    sortino_ratio: 0.10
    dsr: 0.15
  risk_weights:
    annualized_return: 0.35
    sharpe_ratio: 0.25
    sortino_ratio: 0.20
    psr: 0.10
    dsr: 0.25
    annualized_volatility: 0.25
    abs_max_drawdown: 0.35
    abs_cvar_95: 0.30
    abs_cdar_95: 0.00
    downside_deviation: 0.15
    turnover: 0.05
